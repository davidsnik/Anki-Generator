[project]
name = "anki-generator"
version = "0.1.0"
description = "A local foundation for evidence-based university Anki flashcards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "typer>=0.20,<1",
]

[project.scripts]
anki-generator = "anki_generator.cli:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

