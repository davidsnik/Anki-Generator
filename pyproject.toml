[project]
name = "anki-generator"
version = "0.1.0"
description = "A local, evidence-based course material to Anki application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "genanki>=0.13,<1",
    "keyring>=25,<27",
    "numpy>=2,<3",
    "openai>=2,<3",
    "pillow>=11,<13",
    "pydantic>=2.12,<3",
    "pymupdf>=1.26,<2",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "python-pptx>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "sympy>=1.14,<2",
    "typer>=0.20,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
anki-generator = "anki_generator.cli:app"

[project.optional-dependencies]
anki-integration = [
    "anki==26.9.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<10", "ruff>=0.14,<1"]
desktop-build = ["pyinstaller==6.22.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["anki_integration: official Anki core imports into disposable temporary collections"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

