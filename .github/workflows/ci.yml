name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.19.0"
      - name: Install locked dependencies
        run: make setup
      - name: Build production interface
        run: make build-web
      - name: Check source and unit tests
        run: make check
      - name: Inspect synthetic course
        run: uv run --locked anki-generator inspect fixtures/example-course --output outputs/example
      - name: Install test browser
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Browser workflow with offline provider
        run: make test-browser
